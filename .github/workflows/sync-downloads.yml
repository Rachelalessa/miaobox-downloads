name: Sync verified website downloads

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: website-release-sync
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Fetch and verify public installer and portable packages
        run: |
          python - <<'PY'
          from concurrent.futures import ThreadPoolExecutor
          import hashlib, json, pathlib, re, time, urllib.request
          with urllib.request.urlopen('https://download.miaobox.icu/updates/stable/manifest.json',timeout=30) as response:
              manifest=json.load(response)
          version=manifest['download_version']
          assert version=='4.2.68', 'Full package version changed; review the workflow before syncing'
          folder=pathlib.Path('release_files'); folder.mkdir()
          def fetch(kind):
              item=manifest['downloads'][kind]
              name=item['filename']; digest=item['sha256']; size=item['size']
              assert re.fullmatch(r'MiaoBox_v[0-9.]+_(Setup.exe|Portable.zip)',name)
              assert re.fullmatch('[a-f0-9]{64}',digest)
              assert item['version']==version
              assert item['url']=='https://download.miaobox.icu/downloads/'+digest+'/'+name
              sha=hashlib.sha256(); length=0; last=time.monotonic()
              with urllib.request.urlopen(item['url'],timeout=60) as response, (folder/name).open('wb') as target:
                  while chunk:=response.read(1024*1024):
                      length+=len(chunk); assert length<=size
                      target.write(chunk);sha.update(chunk)
                      if time.monotonic()-last>=15:
                          print(name,length,'/',size,flush=True);last=time.monotonic()
              assert length==size and sha.hexdigest()==digest
              print('Verified',name,length,digest,flush=True)
              return digest+'  '+name+'\n'
          with ThreadPoolExecutor(max_workers=2) as pool:
              lines=list(pool.map(fetch,['installer','portable']))
          (folder/'SHA256SUMS.txt').write_text(''.join(lines))
          pathlib.Path('release_notes.md').write_text('官网下载完整包 v'+version+'。安装后可通过客户端更新至最新版本。\n\n仅发布安装包、免安装包和校验值，不包含客户端源码。\n\n官网下载：https://miaobox.icu/download\n')
          PY
      - name: Publish verified binary attachments
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view v4.2.68 >/dev/null 2>&1 || gh release create v4.2.68 --draft --title '喵Box v4.2.68' --notes-file release_notes.md
          gh release upload v4.2.68 release_files/* --clobber
          gh release edit v4.2.68 --draft=false
